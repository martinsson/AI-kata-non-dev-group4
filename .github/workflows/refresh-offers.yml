name: Refresh offers database

# Rafraîchit site/offers.json depuis les API officielles, puis commit sur main
# (ce qui déclenche automatiquement le workflow de déploiement GitHub Pages).

on:
  schedule:
    - cron: "0 */6 * * *"   # toutes les 6 heures
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-offers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch offers from official APIs
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          LBA_CALLER: ${{ secrets.LBA_CALLER }}
        run: node scripts/fetch-offers.mjs

      - name: Commit updated database if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/offers.json
          if git diff --cached --quiet; then
            echo "Aucun changement dans offers.json."
          else
            git commit -m "chore: refresh offers database from official APIs"
            git push
          fi
