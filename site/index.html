<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
    }
    .card {
      background: var(--card);
      padding: 2.5rem 3rem;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      text-align: center;
      max-width: 90vw;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 2.5rem;
    }
    .wave { display: inline-block; animation: wave 1.8s ease-in-out infinite; transform-origin: 70% 70%; }
    @keyframes wave {
      0%, 60%, 100% { transform: rotate(0deg); }
      10% { transform: rotate(14deg); }
      20% { transform: rotate(-8deg); }
      30% { transform: rotate(14deg); }
      40% { transform: rotate(-4deg); }
      50% { transform: rotate(10deg); }
    }
    p { color: var(--muted); margin: 0 0 1.5rem; }
    button {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 0.7rem 1.4rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s ease, filter 0.1s ease;
    }
    button:hover { filter: brightness(1.1); }
    button:active { transform: scale(0.96); }
    #greeting { margin-top: 1.25rem; font-size: 1.1rem; min-height: 1.5rem; color: var(--accent); }
  </style>
</head>
<body>
  <main class="card">
    <h1>Hello, world! <span class="wave">👋</span></h1>
    <p>Bienvenue sur votre première appli web.</p>
    <button id="greet-btn">Dis bonjour</button>
    <div id="greeting"></div>
  </main>

  <script>
    const greetings = [
      "Bonjour ! 🇫🇷",
      "Hello! 🇬🇧",
      "Hola! 🇪🇸",
      "Ciao! 🇮🇹",
      "Hallo! 🇩🇪",
      "こんにちは! 🇯🇵",
    ];
    const btn = document.getElementById("greet-btn");
    const out = document.getElementById("greeting");
    let i = 0;
    btn.addEventListener("click", () => {
      out.textContent = greetings[i % greetings.length];
      i++;
    });
  </script>
</body>
</html>
