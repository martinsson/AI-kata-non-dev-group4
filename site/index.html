<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PSYVAGO</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Georgia', serif;
      background: #1a1a2e;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    header {
      position: fixed;
      top: 0;
      width: 100%;
      text-align: center;
      padding: 16px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
    }

    header h1 {
      font-size: 1.8rem;
      letter-spacing: 4px;
      color: #a78bfa;
    }

    header p {
      font-size: 0.8rem;
      color: #888;
      letter-spacing: 2px;
      margin-top: 2px;
    }

    #chat {
      margin-top: 90px;
      margin-bottom: 80px;
      width: 100%;
      max-width: 640px;
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .bubble {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.5;
      font-size: 0.95rem;
    }

    .bubble.psyvago {
      background: #2d2b55;
      border-bottom-left-radius: 4px;
      align-self: flex-start;
      color: #d4b8ff;
    }

    .bubble.patient {
      background: #0f3460;
      border-bottom-right-radius: 4px;
      align-self: flex-end;
      color: #e0e0e0;
    }

    .bubble.result {
      background: #1b3a2d;
      border: 1px solid #34d399;
      border-radius: 16px;
      align-self: flex-start;
      color: #a7f3d0;
      max-width: 90%;
    }

    .bubble.result strong {
      color: #34d399;
      display: block;
      margin-bottom: 6px;
      font-size: 1rem;
    }

    .bubble.result p {
      margin-top: 4px;
      font-size: 0.9rem;
      color: #d1fae5;
    }

    #input-area {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #16213e;
      border-top: 1px solid #0f3460;
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    #input-area input {
      flex: 1;
      max-width: 580px;
      padding: 10px 16px;
      border-radius: 24px;
      border: 1px solid #0f3460;
      background: #1a1a2e;
      color: #e0e0e0;
      font-size: 0.95rem;
      outline: none;
    }

    #input-area input:focus {
      border-color: #a78bfa;
    }

    #input-area button {
      padding: 10px 20px;
      border-radius: 24px;
      border: none;
      background: #a78bfa;
      color: #1a1a2e;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95rem;
    }

    #input-area button:hover { background: #c4b5fd; }
    #input-area button:disabled { background: #555; cursor: default; }
  </style>
</head>
<body>

  <header>
    <h1>PSYVAGO</h1>
    <p>Votre espace d'écoute</p>
  </header>

  <div id="chat"></div>

  <div id="input-area">
    <input id="msg" type="text" placeholder="Exprimez-vous librement…" autocomplete="off" />
    <button id="send-btn" onclick="send()">Envoyer</button>
  </div>

  <script>
    const questions = [
      "Bonjour, je suis PSYVAGO. Je suis là pour vous écouter sans jugement. Quel est le problème principal qui vous préoccupe en ce moment ?",
      "Est-ce que cela impacte votre quotidien — sommeil, travail, relations — et depuis combien de temps ?",
      "Avez-vous déjà vécu des épisodes similaires, ou est-ce la première fois ?"
    ];

    // Praticiens indexés par profil
    const praticiens = [
      {
        titre: "Dr. Isabelle Renard — Psychiatre",
        adresse: "12 rue des Acacias, Paris 17e",
        telephone: "01 42 38 91 05",
        disponibilite: "Lundi, mercredi, vendredi — sur rendez-vous",
        description: "Médecin psychiatre avec 20 ans d'expérience. Spécialisée dans les troubles de l'humeur, la dépression sévère et les troubles bipolaires. Approche médicamenteuse et thérapeutique combinée.",
        mots_cles: ["dépression", "déprimé", "bipolaire", "psychose", "hallucination", "médicament", "traitement", "grave", "sévère", "suicide", "mourir", "crise", "hospitali"]
      },
      {
        titre: "Thomas Lecomte — Psychologue clinicien",
        adresse: "8 avenue Gambetta, Lyon 3e",
        telephone: "04 78 52 14 67",
        disponibilite: "Mardi au samedi — consultations en présentiel et en ligne",
        description: "Psychologue clinicien spécialisé dans l'anxiété, les phobies, les traumatismes et le deuil. Accompagnement bienveillant sur le long terme.",
        mots_cles: ["anxieux", "anxiété", "angoisse", "phobie", "trauma", "deuil", "peur", "stress", "émotions", "pleur", "triste", "insomnie", "cauchemar"]
      },
      {
        titre: "Sophie Marchais — Psychothérapeute TCC",
        adresse: "3 place Saint-Michel, Bordeaux",
        telephone: "05 56 44 23 89",
        disponibilite: "Lundi au jeudi — séances de 50 minutes",
        description: "Thérapeute certifiée en Thérapies Cognitivo-Comportementales. Experte des TOC, des pensées obsessionnelles, des addictions et des comportements répétitifs.",
        mots_cles: ["obsession", "toc", "répétition", "rituel", "addiction", "alcool", "drogue", "pensée", "négatif", "rumination", "comportement"]
      },
      {
        titre: "Marc & Julie Fontaine — Thérapeutes de couple",
        adresse: "27 rue de la Paix, Nantes",
        telephone: "02 40 73 56 12",
        disponibilite: "Mercredi et samedi — séances en duo ou en famille",
        description: "Duo de thérapeutes spécialisés dans la médiation de couple et les conflits familiaux. Approche systémique et communication non-violente.",
        mots_cles: ["couple", "mari", "femme", "relation", "famille", "enfant", "parent", "divorce", "séparation", "conflit", "communication"]
      },
      {
        titre: "Dr. Karim Bensalem — Psychologue du travail",
        adresse: "15 boulevard Haussmann, Paris 9e",
        telephone: "01 53 27 84 30",
        disponibilite: "Du lundi au vendredi — consultations express disponibles",
        description: "Psychologue spécialisé en souffrance au travail. Prise en charge du burn-out, du harcèlement professionnel et de l'épuisement lié à la pression managériale.",
        mots_cles: ["travail", "bureau", "boss", "collègue", "burn-out", "burnout", "harcèlement", "fatigue", "épuisement", "boulot", "licencié", "chômage"]
      }
    ];

    let step = 0;
    const reponses = [];

    function addBubble(text, who) {
      const chat = document.getElementById('chat');
      const b = document.createElement('div');
      b.className = 'bubble ' + who;
      b.textContent = text;
      chat.appendChild(b);
      chat.scrollTop = chat.scrollHeight;
    }

    function addResult(praticien) {
      const chat = document.getElementById('chat');
      const b = document.createElement('div');
      b.className = 'bubble result';
      b.innerHTML = `
        <strong>Notre recommandation</strong>
        <p><b>${praticien.titre}</b></p>
        <p>📍 ${praticien.adresse}</p>
        <p>📞 ${praticien.telephone}</p>
        <p>🗓 ${praticien.disponibilite}</p>
        <p style="margin-top:8px;color:#a7f3d0">${praticien.description}</p>
      `;
      chat.appendChild(b);
      chat.scrollTop = chat.scrollHeight;
    }

    function analyser() {
      const texte = reponses.join(' ').toLowerCase();
      let meilleur = null;
      let maxScore = -1;

      for (const p of praticiens) {
        const score = p.mots_cles.filter(mot => texte.includes(mot)).length;
        if (score > maxScore) {
          maxScore = score;
          meilleur = p;
        }
      }

      // Par défaut : psychologue clinicien
      return meilleur || praticiens[1];
    }

    function send() {
      const input = document.getElementById('msg');
      const text = input.value.trim();
      if (!text) return;

      addBubble(text, 'patient');
      reponses.push(text);
      input.value = '';

      if (step < questions.length) {
        setTimeout(() => {
          addBubble(questions[step], 'psyvago');
          step++;
        }, 600);
      } else {
        // Les 3 réponses sont collectées — on oriente
        document.getElementById('send-btn').disabled = true;
        input.disabled = true;
        input.placeholder = "Consultation terminée";

        setTimeout(() => {
          addBubble("Merci pour ces informations. En fonction de ce que vous m'avez partagé, voici le professionnel le plus adapté à votre situation :", 'psyvago');
          setTimeout(() => {
            addResult(analyser());
          }, 800);
        }, 700);
      }
    }

    document.getElementById('msg').addEventListener('keydown', e => {
      if (e.key === 'Enter') send();
    });

    setTimeout(() => {
      addBubble(questions[step], 'psyvago');
      step++;
    }, 400);
  </script>

</body>
</html>
